<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音 JSON 路径抽取器</title>
<style>
/* ==================== CSS Variables & Base ==================== */
:root {
  --c-bg: #0b0f18;
  --c-surface: #131a2b;
  --c-surface2: #192135;
  --c-border: #25304a;
  --c-border-light: #2a3555;
  --c-primary: #3B82F6;
  --c-primary-dim: #2563EB;
  --c-primary-glow: rgba(59,130,246,0.25);
  --c-success: #10B981;
  --c-error: #EF4444;
  --c-warning: #F59E0B;
  --c-purple: #8B5CF6;
  --c-text: #e2e8f0;
  --c-text-dim: #94a3b8;
  --c-text-muted: #64748b;
  --c-highlight: #fef08a;
  --c-highlight-bg: rgba(254,240,138,0.18);
  --radius: 10px;
  --radius-sm: 6px;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
  --font-body: 'Inter', system-ui, -apple-system, 'PingFang SC', sans-serif;
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-smooth: 280ms cubic-bezier(0.25, 0.1, 0.25, 1);
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; scrollbar-width:thin; scrollbar-color:transparent transparent; }
*:hover { scrollbar-color:var(--c-border) transparent; }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:transparent; border-radius:3px; }
*:hover::-webkit-scrollbar-thumb { background:var(--c-border); }
::-webkit-scrollbar-thumb:hover { background:var(--c-text-muted); }
html, body { height:100%; }
body {
  font-family: var(--font-body);
  background: var(--c-bg);
  color: var(--c-text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--c-primary); color: #fff; }

/* ==================== Layout ==================== */
#app { display:flex; flex-direction:column; height:100vh; }
#header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 20px; background: var(--c-surface); border-bottom:1px solid var(--c-border);
  flex-shrink:0; z-index:10;
}
#header-left { display:flex; align-items:center; gap:12px; }
#header-left .icon { width:28px; height:28px;
  background: linear-gradient(135deg, var(--c-primary), var(--c-purple));
  border-radius:7px; display:flex; align-items:center; justify-content:center;
  font-size:14px; color:#fff; font-weight:700;
}
#header-left h1 { font-family: var(--font-display); font-size:15px; font-weight:700; letter-spacing:-0.5px; }
#header-right { display:flex; align-items:center; gap:10px; }
#api-key-input {
  background: var(--c-surface2); border:1px solid var(--c-border); border-radius:var(--radius-sm);
  color: var(--c-text); padding:6px 12px; font-size:12px; width:320px;
  font-family: var(--font-mono); transition: border var(--transition-fast);
}
#api-key-input:focus { outline:none; border-color: var(--c-primary); box-shadow:0 0 0 3px var(--c-primary-glow); }
#api-key-input::placeholder { color: var(--c-text-muted); }
#header-version { font-size:11px; color: var(--c-text-muted); }
#header-help { font-size:11px; color: var(--c-text-dim); cursor:pointer; transition:color var(--transition-fast); }
#header-help:hover { color: var(--c-primary); }

#main { display:flex; flex:1; overflow:hidden; gap:1px; background: var(--c-border); position:relative; }
.resizer { width:1px; background:transparent; cursor:col-resize; transition:all 0.25s; z-index:10; position:relative; }
.resizer::after { content:''; position:absolute; inset:-20px -4px; }
.resizer:hover, .resizer.resizing { background:var(--c-primary); box-shadow:0 0 8px var(--c-primary-glow); }

.panel {
  background: var(--c-surface); display:flex; flex-direction:column;
  flex:1; min-width:0; overflow:hidden;
}
.panel-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; border-bottom:1px solid var(--c-border); flex-shrink:0;
  background: var(--c-surface2);
}
.panel-header h2 { font-size:12px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color: var(--c-text-dim); padding-left:10px; border-left:2px solid var(--c-primary); line-height:1; transition:border-color 0.3s; }
.panel:hover .panel-header h2 { border-left-color:var(--c-primary-dim); }
.panel-body { flex:1; overflow:auto; padding:12px; }
.panel-footer { border-top:1px solid var(--c-border); padding:8px 12px; flex-shrink:0; font-size:11px; color:var(--c-text-muted); }

/* ==================== Left Panel ==================== */
/* Freeze input area at top, tree scrolls below */
#left-panel .panel-body { display:flex; flex-direction:column; }
#json-input {
  width:100%; min-height:180px; background: var(--c-surface2); border:1px solid var(--c-border);
  border-radius:var(--radius-sm); color: var(--c-text); padding:12px; font-family: var(--font-mono);
  font-size:12px; line-height:1.6; resize:vertical; transition:border var(--transition-fast);
  flex-shrink:0;
}
#json-input:focus { outline:none; border-color: var(--c-primary); }
#json-input.error { border-color: var(--c-error); box-shadow:0 0 0 3px rgba(239,68,68,0.15); }
/* Actions bar: toolbar + format button in one row */
#json-actions-bar {
  display:flex; align-items:center; gap:8px; margin-top:8px; flex-shrink:0;
  padding:6px 10px; background: var(--c-surface2); border:1px solid var(--c-border);
  border-radius:var(--radius-sm);
}
#json-toolbar {
  display:flex; align-items:center; gap:6px; flex-shrink:0;
}
#json-toolbar .btn-sm {
  font-size:11px; padding:4px 8px;
}
#json-error-msg { display:none; color: var(--c-error); font-size:11px; margin-top:6px; white-space:pre-wrap; flex-shrink:0; }
#btn-format {
  flex:1; padding:6px 12px; background: var(--c-primary); color:#fff;
  border:none; border-radius:var(--radius-sm); font-size:12px; font-weight:600; cursor:pointer;
  transition:all var(--transition-fast); letter-spacing:0.3px; white-space:nowrap;
}
#btn-format:hover { background: var(--c-primary-dim); box-shadow:0 0 14px var(--c-primary-glow); }
#tree-container { margin-top:10px; flex:1; overflow-y:auto; min-height:60px; }
#tree-container .empty-state { text-align:center; padding:40px 20px; color: var(--c-text-muted); font-size:12px; }

/* Tree styles */
.tree-node { margin-left:0; user-select:none; }
.tree-node .node-row { display:flex; align-items:center; padding:3px 0; padding-left:calc(var(--depth,0)*18px); cursor:default; border-radius:3px; transition:background 80ms; font-size:12px; }
.tree-node .node-row:hover { background: rgba(255,255,255,0.03); }
.tree-node .node-row.highlight { background: var(--c-highlight-bg); animation: highlightPulse 2s ease-out; }
@keyframes highlightPulse {
  0% { background: rgba(254,240,138,0.4); }
  100% { background: var(--c-highlight-bg); }
}
.tree-arrow { width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color: var(--c-text-muted); flex-shrink:0; transition:transform var(--transition-fast); font-size:10px; }
.tree-arrow.expanded { transform:rotate(90deg); }
.tree-arrow.hidden { visibility:hidden; }
.tree-key { color: #e879f9; margin:0 4px; font-weight:500; white-space:nowrap; }
.tree-colon { color: var(--c-text-muted); }
.tree-val { margin-left:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:help; position:relative; }
.tree-link { cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px; text-decoration-color:inherit; }
.tree-link:hover { color:#60a5fa !important; text-decoration-style:solid; }
.tree-val.str { color: #4ade80; }
.tree-val.num { color: #60a5fa; }
.tree-val.bool { color: #fbbf24; }
.tree-val.null { color: var(--c-text-muted); font-style:italic; }
.tree-brace { color: var(--c-text-dim); margin:0 2px; }
.tree-count { color: var(--c-text-muted); font-size:11px; margin-left:4px; }
.tree-type-hint { color: var(--c-text-muted); font-size:10px; font-style:italic; margin-left:4px; }
/* Tooltip for truncated values */
.tree-val[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute; background: #1e293b; color: #e2e8f0; padding:6px 10px;
  border-radius:4px; font-size:11px; max-width:420px; word-break:break-all;
  white-space:normal; z-index:100; pointer-events:none;
  transform:translateY(-100%); box-shadow:0 4px 16px rgba(0,0,0,0.4);
  border:1px solid var(--c-border);
}

/* ==================== Middle Panel ==================== */
/* Freeze search + actions at top, buttons scroll below */
#middle-panel .panel-body { display:flex; flex-direction:column; }
#search-box {
  width:100%; background: var(--c-surface2); border:1px solid var(--c-border); border-radius:var(--radius-sm);
  color: var(--c-text); padding:7px 12px; font-size:12px; margin-bottom:8px; transition:border var(--transition-fast);
  flex-shrink:0;
}
#search-box:focus { outline:none; border-color: var(--c-primary); }
/* Middle panel actions bar — same style as left panel */
#batch-actions {
  display:flex; gap:6px; margin-bottom:8px; flex-shrink:0;
  padding:6px 10px; background: var(--c-surface2); border:1px solid var(--c-border);
  border-radius:var(--radius-sm);
}
.btn-sm {
  padding:4px 10px; border-radius:var(--radius-sm); font-size:11px; cursor:pointer;
  border:1px solid var(--c-border); background: var(--c-surface); color: var(--c-text-dim);
  transition:all var(--transition-fast); font-weight:500; white-space:nowrap;
}
/* First 3: compact, last 2: fill remaining */
#btn-select-all, #btn-invert, #btn-clear { flex-shrink:0; }
#btn-filter-empty, #btn-translation { flex:1; text-align:center; justify-content:center; }
.btn-sm:hover { background: var(--c-border); color: var(--c-text); transform:translateY(-1px); }
.btn-sm:active { transform: scale(0.96); transition: transform 0.08s; }
#btn-clear:hover { border-color: var(--c-error); color: var(--c-error); }
#btn-filter-empty.active { background: var(--c-error); color:#fff; border-color:var(--c-error); }
#btn-translation { background: var(--c-primary); color:#fff; border-color:var(--c-primary); }
#btn-translation:hover { background: var(--c-primary-dim); box-shadow:0 0 10px var(--c-primary-glow); }
#btn-translation:disabled { background: var(--c-surface); color: var(--c-text-muted); border-color:var(--c-border); box-shadow:none; }
/* Toggle button */
.btn-toggle.active { background: var(--c-primary); color:#fff; border-color:var(--c-primary); }
.btn-toggle.active:hover { background: var(--c-primary-dim); }
#progress-bar { display:none; font-size:11px; color: var(--c-primary); margin-bottom:6px; text-align:center; flex-shrink:0; }
#selector-buttons { display:flex; flex-direction:column; gap:0; flex:1; overflow-y:auto; min-height:60px; }
/* Button tree groups */
.btn-group { margin:0; }
.btn-group-header {
  display:flex; align-items:center; gap:6px; padding:5px 8px; cursor:pointer;
  font-size:11px; color: var(--c-text-dim); border-bottom:1px solid var(--c-border);
  user-select:none; transition:background var(--transition-fast);
  font-family:var(--font-mono);
}
.btn-group-header:hover { background: var(--c-surface2); }
.btn-group-header .grp-arrow {
  width:14px; height:14px; display:inline-flex; align-items:center; justify-content:center;
  font-size:9px; color: var(--c-text-muted); flex-shrink:0; transition:transform var(--transition-fast);
}
.btn-group-header .grp-arrow.expanded { transform:rotate(90deg); }
.btn-group-header .grp-path { color: var(--c-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.btn-group-header .grp-count { margin-left:auto; font-size:10px; color: var(--c-text-muted); }
.btn-group-body { overflow:hidden; }
.btn-group-body.collapsed { display:none; }
/* Wildcard quick-select strip */
.grp-wild-strip {
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  background: linear-gradient(90deg, rgba(16,185,129,0.12), rgba(16,185,129,0.05));
  border-bottom:1px solid rgba(16,185,129,0.18); flex-wrap:wrap;
}
.grp-wild-strip .wild-label {
  color: #6ee7b7; font-weight:700; font-size:11px; white-space:nowrap;
  font-family: var(--font-mono); flex-shrink:0;
}
.grp-wild-badge {
  font-size:11px; padding:3px 10px; border-radius:5px;
  background: rgba(16,185,129,0.2); color: #6ee7b7; cursor:pointer;
  font-weight:600; font-family: var(--font-mono);
  border:1px solid rgba(16,185,129,0.35); white-space:nowrap;
  transition: all 0.15s; user-select:none; line-height:1.4; flex-shrink:0;
}
.grp-wild-badge:hover {
  background: rgba(16,185,129,0.5); color: #fff;
  border-color: rgba(16,185,129,0.7);
  box-shadow: 0 0 10px rgba(16,185,129,0.35);
  transform: translateY(-1px);
}
.grp-wild-badge:active {
  transform: scale(0.94);
  transition: transform 0.08s;
}
/* Leaf button - full width single row */
.leaf-btn {
  display:flex; align-items:center; gap:6px; width:100%;
  padding:5px 12px 5px 8px; border-radius:0; font-size:12px; cursor:pointer;
  border:none; border-bottom:1px solid rgba(255,255,255,0.03);
  background: transparent; color: var(--c-text-dim);
  transition:all var(--transition-fast); position:relative;
  text-align:left; font-family: var(--font-mono);
}
.leaf-btn:hover { background: var(--c-surface2); color: var(--c-text); }
.leaf-btn .btn-en { font-size:12px; font-weight:600; color: var(--c-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0; }
.leaf-btn .btn-cn { font-size:11px; color: #f59e0b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
.leaf-btn.state-selected { background: var(--c-primary); color:#fff; border-bottom-color: var(--c-primary-dim); }
.leaf-btn.state-selected .btn-en { color:#fff; }
.leaf-btn.state-selected .btn-cn { color:#fcd34d; }
.leaf-btn.state-previewed {
  border:1px dashed var(--c-primary); border-bottom-color: var(--c-primary);
  animation: btnRowPulse 1.2s ease-in-out infinite;
  background: rgba(59,130,246,0.06);
}
@keyframes btnRowPulse {
  0%,100% { box-shadow:inset 0 0 0 0 var(--c-primary-glow); }
  50% { box-shadow:inset 0 0 0 4px rgba(59,130,246,0); }
}
.leaf-btn.array-pending { border-left:2px solid var(--c-warning); }
.leaf-btn.array-pending::after { content:'⟳'; font-size:13px; margin-left:auto; color:var(--c-warning); }
.leaf-btn.array-empty { color: var(--c-text-muted); cursor:not-allowed; opacity:0.4; }
/* Value indicators */
.leaf-btn .val-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-right:2px; }
.leaf-btn .val-dot.empty { background: var(--c-error); box-shadow:0 0 6px rgba(239,68,68,0.5); }
.leaf-btn .val-dot.has {  background: var(--c-success); box-shadow:0 0 6px rgba(16,185,129,0.5); }
.leaf-btn.filtered-empty { display:none !important; }
.leaf-btn .edit-idx { margin-left:auto; font-size:10px; cursor:pointer; color: inherit; flex-shrink:0; display:none; }
.leaf-btn.state-previewed .edit-idx,
.leaf-btn.state-selected .edit-idx { display:inline; }
.empty-state-msg { text-align:center; padding:32px 24px; color: var(--c-text-muted); font-size:12px; border:1px dashed var(--c-border); border-radius:var(--radius-sm); background:rgba(255,255,255,0.012); margin:8px 0; }

/* Translation source badges (used in modal) */
.trans-source { font-size:9px; padding:1px 5px; border-radius:3px; margin-left:4px; }
.trans-source.dict { background:rgba(139,92,246,0.2); color:#c4b5fd; }
.trans-source.api  { background:rgba(16,185,129,0.2); color:#6ee7b7; }
.trans-source.local { background:rgba(100,116,139,0.2); color:#94a3b8; }

/* ==================== Right Panel ==================== */
#output-fields-list { margin-bottom:12px; }
.output-field-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
.output-field-row .output-key-input {
  width:160px; flex-shrink:0; background: var(--c-surface2); border:1px solid var(--c-border);
  border-radius:var(--radius-sm); color: #fbbf24; padding:4px 8px; font-size:11px; font-family:var(--font-mono);
  transition:border var(--transition-fast);
}
.output-field-row .output-key-input:focus { outline:none; border-color: var(--c-primary); }
.output-field-row .output-path-display {
  flex:1; font-size:11px; color: var(--c-text-dim); font-family: var(--font-mono);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; user-select:all; cursor:text;
}
.output-field-row .output-remove { color:var(--c-text-muted); cursor:pointer; font-size:14px; padding:0 4px; transition:color var(--transition-fast); flex-shrink:0; }
.output-field-row .output-remove:hover { color: var(--c-error); }
#output-code-block {
  background: var(--c-surface2); border:1px solid var(--c-border); border-radius:var(--radius-sm);
  padding:14px 16px; font-family:var(--font-mono); font-size:12px; line-height:1.8; color: #4ade80;
  white-space:pre-wrap; overflow:auto; max-height:400px; position:relative;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.25);
}
#btn-copy {
  position:absolute; top:8px; right:8px; padding:4px 10px; background: var(--c-primary); color:#fff;
  border:none; border-radius:var(--radius-sm); font-size:11px; cursor:pointer;
  transition:all var(--transition-fast); font-weight:500;
}
#btn-copy:hover { background: var(--c-primary-dim); }
#btn-copy.copied { background: var(--c-success); }
#output-stats { font-size:11px; color: var(--c-text-muted); margin-bottom:8px; }

/* ==================== Modal/Dialog ==================== */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65);
  z-index:100; align-items:center; justify-content:center; backdrop-filter:blur(4px);
}
.modal-overlay.active { display:flex; }
.modal-box {
  background: var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius);
  max-width:600px; width:90%; max-height:70vh; overflow:auto; padding:20px;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);
}
.modal-box h3 { font-size:14px; font-weight:600; margin-bottom:12px; color: var(--c-text); }
.modal-box .array-step { color: var(--c-warning); font-size:12px; margin-bottom:8px; }
.modal-array-list { display:flex; flex-direction:column; gap:6px; }
.modal-array-item {
  padding:8px 12px; background: var(--c-surface2); border:1px solid var(--c-border);
  border-radius:var(--radius-sm); cursor:pointer; transition:all var(--transition-fast); font-size:12px; color: var(--c-text);
}
.modal-array-item:hover { border-color: var(--c-primary); background: rgba(59,130,246,0.08); }
.modal-array-item.basic-item { font-family:var(--font-mono); }
.modal-array-table { width:100%; border-collapse:collapse; font-size:11px; margin-bottom:8px; }
.modal-array-table th { text-align:left; padding:4px 8px; color:var(--c-text-muted); border-bottom:1px solid var(--c-border); }
.modal-array-table td { padding:4px 8px; color:var(--c-text-dim); cursor:pointer; }
.modal-array-table tr:hover td { background:rgba(59,130,246,0.08); }
.modal-more { font-size:11px; color:var(--c-text-muted); text-align:center; padding:8px; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
.modal-btn {
  padding:6px 16px; border-radius:var(--radius-sm); font-size:12px; cursor:pointer;
  border:1px solid var(--c-border); background: var(--c-surface2); color: var(--c-text-dim);
  transition:all var(--transition-fast);
}
.modal-btn:hover { background: var(--c-border); }
.modal-btn.primary { background: var(--c-primary); color:#fff; border-color:var(--c-primary); }
.modal-btn.primary:hover { background: var(--c-primary-dim); }
.modal-cancel { cursor:pointer; color:var(--c-text-muted); }
.modal-cancel:hover { color:var(--c-text); }
.modal-box table tr:nth-child(even) td { background:rgba(255,255,255,0.015); }

/* ==================== Toast / Confirm Dialog ==================== */
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:200;
  padding:10px 20px; border-radius:var(--radius-sm); font-size:12px; font-weight:500;
  opacity:0; transition:opacity var(--transition-smooth); pointer-events:none;
}
.toast.show { opacity:1; }
.toast.success { background: var(--c-success); color:#fff; }
.toast.error { background: var(--c-error); color:#fff; }
.toast.warning { background: var(--c-warning); color:#000; }
</style>
</head>
<body>

<div id="app">
  <!-- ===== HEADER ===== -->
  <div id="header">
    <div id="header-left">
      <div class="icon">J</div>
      <h1>抖音 JSON 路径抽取器</h1>
    </div>
    <div id="header-right">
      <input type="password" id="api-key-input" placeholder="DeepSeek API Key（用于 AI 翻译）" autocomplete="off" />
      <button class="btn-sm btn-toggle" id="btn-api-key-save" title="记住 API Key，刷新页面不丢失">记住</button>

  try {
    const raw = jsonInput.value.trim();
    if (!raw) { showToast('请先粘贴 JSON 数据', 'warning'); return; }

    // Check if there are existing selections
    const hasSelections = state.leafEntries.some(e => e.state === 'selected' || e.state === 'previewed');
    if (hasSelections) {
      if (!confirm('将清空当前所有选择，确定？')) return;
    }

    // Reset
    resetAll();

    try {
      state.parsedJson = JSON.parse(raw);
    } catch (err) {
      jsonInput.classList.add('error');
      jsonErrorMsg.style.display = 'block';
      const match = err.message.match(/position\s+(\d+)/);
      let msg = 'JSON 格式错误: ' + err.message;
      if (match) {
        const pos = parseInt(match[1]);
        const lines = raw.substring(0, pos).split('\n');
        const line = lines.length;
        const col = lines[lines.length-1].length + 1;
        msg += `\n位置: 第 ${line} 行, 第 ${col} 列`;
      }
      jsonErrorMsg.textContent = msg;
      return;
    }

    jsonInput.classList.remove('error');
    jsonErrorMsg.style.display = 'none';
    state.isFormatting = true;

    console.log('📦 JSON 解析成功，构建树...');

    // Build tree
    state.treeNodes = buildTreeNode(null, state.parsedJson, '$');

    // Pre-fill quick translations (dict + auto), then render buttons immediately
    prefillTranslations();

    btnClear.disabled = false;
    btnFilterEmpty.disabled = false;

  } catch (err) {
    console.error('❌ 格式化出错:', err);
    showToast('格式化出错: ' + err.message, 'error');
    state.isFormatting = false;
  }
});

// ==================== TREE BUILDING ====================
function buildTreeNode(parentKey, value, path) {
  const type = Array.isArray(value) ? 'array' : value === null ? 'null' : typeof value;
  const isLeaf = type !== 'object' && type !== 'array';
  const node = { key: parentKey || 'root', path, type, value, children: [], isLeaf };

  if (!isLeaf) {
    if (type === 'array') {
      for (let i=0; i<value.length; i++) {
        const childPath = path + '[' + i + ']';
        node.children.push(buildTreeNode('[' + i + ']', value[i], childPath));
      }
    } else {
      // Sort keys alphabetically for consistent ordering
      const sortedKeys = Object.keys(value).sort((a, b) => a.localeCompare(b, 'zh-CN'));
      for (const k of sortedKeys) {
        const childPath = path + '.' + k;
        node.children.push(buildTreeNode(k, value[k], childPath));
      }
    }
  }
  return node;
}

function renderTree(nodes) {
  treeContainer.innerHTML = '';
  if (!nodes) { treeContainer.innerHTML = '<div class="empty-state">等待 JSON 输入...</div>'; return; }
  const frag = document.createDocumentFragment();
  renderTreeNodes(nodes, frag, 0, true);
  treeContainer.appendChild(frag);
}

function renderTreeNodes(nodes, container, depth, autoExpand) {
  for (const node of nodes) {
    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';
    wrapper.style.setProperty('--depth', depth);

    const row = document.createElement('div');
    row.className = 'node-row';
    row.setAttribute('data-path', node.path);

    // Arrow
    const arrow = document.createElement('span');
    arrow.className = 'tree-arrow';
    if (node.isLeaf) {
      arrow.classList.add('hidden');
    } else {
      arrow.textContent = '▶';
      if (autoExpand && depth < 2) arrow.classList.add('expanded');
      arrow.addEventListener('click', (e) => {
        e.stopPropagation();
        const willExpand = !arrow.classList.contains('expanded');
        arrow.classList.toggle('expanded');
        const children = wrapper.querySelector(':scope > .tree-children');
        if (children) children.style.display = willExpand ? '' : 'none';
        debugLogLeft(node.path, willExpand ? '展开' : '折叠');
        syncTreeToggle(node.path, 'left', willExpand);
      });
    }
    row.appendChild(arrow);

    // Key
    const keySpan = document.createElement('span');
    keySpan.className = 'tree-key';
    keySpan.textContent = node.key;
    row.appendChild(keySpan);

    // Colon
    if (node.isLeaf) {
      const colon = document.createElement('span');
      colon.className = 'tree-colon';
      colon.textContent = ': ';
      row.appendChild(colon);
    } else if (node.type === 'array') {
      const hint = document.createElement('span');
      hint.className = 'tree-type-hint';
      hint.textContent = node.children.length === 0 ? '[]' : '[' + node.children.length + ']';
      row.appendChild(hint);
    } else {
      const hint = document.createElement('span');
      hint.className = 'tree-type-hint';
      hint.textContent = '{' + node.children.length + '}';
      row.appendChild(hint);
    }

    // Value (leaf)
    if (node.isLeaf) {
      const rawVal = node.value;
      const isUrl = node.type === 'string' && /^https?:\/\//i.test(String(rawVal));

      if (isUrl) {
        // Clickable link for URLs
        const link = document.createElement('a');
        link.className = 'tree-val str tree-link';
        link.href = rawVal;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.title = '点击在新标签页打开';
        let displayVal = rawVal.length > 100 ? rawVal.substring(0, 97) + '...' : rawVal;
        link.textContent = displayVal;
        if (rawVal.length > 100) link.setAttribute('data-tooltip', rawVal);
        row.appendChild(link);
      } else {
        const valSpan = document.createElement('span');
        valSpan.className = 'tree-val';
        let displayVal;
        if (node.type === 'string') {
          valSpan.classList.add('str');
          displayVal = '"' + String(rawVal) + '"';
        } else if (node.type === 'number') {
          valSpan.classList.add('num');
          displayVal = String(rawVal);
        } else if (node.type === 'boolean') {
          valSpan.classList.add('bool');
          displayVal = String(rawVal);
        } else {
          valSpan.classList.add('null');
          displayVal = 'null';
        }
        if (node.type === 'string' && displayVal.length > 108) {
          valSpan.textContent = displayVal.substring(0, 100) + '..."';
          valSpan.setAttribute('data-tooltip', displayVal);
        } else {
          valSpan.textContent = displayVal;
        }
        row.appendChild(valSpan);
      }
    }

    wrapper.appendChild(row);

    // Children
    if (!node.isLeaf) {
      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'tree-children';
      if (!(autoExpand && depth < 2)) {
        childrenWrap.style.display = 'none';
      }
      renderTreeNodes(node.children, childrenWrap, depth + 1, autoExpand && depth < 2);
      wrapper.appendChild(childrenWrap);
    }

    container.appendChild(wrapper);
  }
}

// ==================== LEAF PATH EXTRACTION ====================
function extractLeafPaths(nodes, arrayPathStack) {
  for (const node of nodes) {
    if (node.isLeaf) {
      const entry = createLeafEntry(node, arrayPathStack);
      state.leafEntries.push(entry);
    } else if (node.type === 'array') {
      const hasItems = node.children.length > 0;
      for (const child of node.children) {
        if (child.isLeaf) {
          const entry = createLeafEntry(child, [...arrayPathStack, { path: node.path, hasItems }]);
          state.leafEntries.push(entry);
        } else if (child.type === 'array') {
          extractLeafPaths([child], [...arrayPathStack, { path: node.path, hasItems }]);
        } else if (child.type === 'object') {
          extractLeafPaths(child.children, [...arrayPathStack, { path: node.path, hasItems }]);
        }
      }
    } else if (node.type === 'object') {
      extractLeafPaths(node.children, arrayPathStack);
    }
  }
}

function createLeafEntry(node, arrayPathStack) {
  const unresolved = arrayPathStack.some(a => a.hasItems);
  const baseId = makeBaseId(node.path, arrayPathStack);
  const arrayIndexes = {};
  for (const a of arrayPathStack) {
    arrayIndexes[a.path] = -1;
  }
  // For array element nodes like [0], outputKey = array name (e.g., url_list)
  let outKey = node.key;
  if (/^\[\d+\]$/.test(node.key)) {
    const lastDot = node.path.lastIndexOf('.');
    const lastSegment = lastDot >= 0 ? node.path.substring(lastDot + 1) : node.path;
    outKey = lastSegment.replace(/\[\d+\]/, '');
  }
  return {
    id: baseId,
    keyName: node.key,
    fullJsonPath: node.path,
    value: node.value,
    chineseName: '',
    outputKey: outKey,
    userEdited: false,
    state: 'default',
    arrayIndexes,
    hasUnresolvedArray: unresolved,
  };
}

function makeBaseId(path, arrayPathStack) {
  let id = path;
  for (const a of arrayPathStack) {
    id = id.replace(a.path, a.path.replace(/\[\d+\]/g, '[_]'));
  }
  id = id.replace(/\[\d+\]/g, '[_]');
  return id;
}

// ==================== TRANSLATION ====================
// 快速预填充：词典 + 本地翻译 → 按钮立即显示
function prefillTranslations() {
  const uniqueKeys = [...new Set(state.leafEntries.map(e => e.keyName))];
  for (const key of uniqueKeys) {
    if (TRANSLATION_DICT[key] !== undefined) {
      state.translationCache[key] = TRANSLATION_DICT[key];
      state.translationSources[key] = 'dict';
    } else {
      state.translationCache[key] = autoTranslate(key);
      state.translationSources[key] = 'local';
    }
  }
  for (const entry of state.leafEntries) {
    entry.chineseName = state.translationCache[entry.keyName];
  }
  renderTranslationTable(uniqueKeys);
  console.log('⚡ 快速预填充完成: ' + uniqueKeys.length + ' 个字段');
}

// 后台 API 翻译 → 完成后原地更新按钮文字
async function translateWithAPI() {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) { setApiStatus('无 API Key'); debugLog('🤖API', '#EF4444', '❌ 未设置 API Key，跳过后台翻译'); return; }

  const uniqueKeys = [...new Set(state.leafEntries.map(e => e.keyName))];
  const total = uniqueKeys.length;
  setApiStatus('翻译中 0/' + total);
  debugLog('🤖API', '#8B5CF6', '开始后台翻译 ' + total + ' 个字段 | Key=' + apiKey.substring(0,6) + '...');

  // Animated progress counter — ticks up toward ~95% to leave final jump
  let progressCount = 0;
  let progressTimer = setInterval(() => {
    if (progressCount < total * 0.95) {
      const remaining = total - progressCount;
      const increment = Math.max(1, Math.floor(Math.random() * Math.min(8, Math.ceil(remaining * 0.15))));
      progressCount = Math.min(Math.ceil(total * 0.95), progressCount + increment);
      setApiStatus('翻译中 ' + progressCount + '/' + total);
    }
  }, 120);

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    const prompt = `Translate ALL these field names to concise Chinese. Return ONLY a JSON object: {"field1":"翻译1","field2":"翻译2",...}. No markdown. Fields: ${JSON.stringify(uniqueKeys)}`;
    debugLog('🤖API', '#8B5CF6', '发送请求', '请求体' + prompt.length + '字');
    const resp = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [{ role: 'user', content: prompt }],
        temperature: 0.05, max_tokens: 8192,
      }),
      signal: controller.signal,
    });
    clearTimeout(timeoutId);
    clearInterval(progressTimer);

    if (resp.ok) {
      const data = await resp.json();
      const content = data.choices?.[0]?.message?.content || '';
      debugLog('🤖API', '#8B5CF6', '收到回复 ' + content.length + ' 字', content.substring(0, 100));
      const jsonMatch = content.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        try {
          const translations = JSON.parse(jsonMatch[0]);
          let apiCount = 0;
          for (const key of uniqueKeys) {
            if (translations[key] && typeof translations[key] === 'string' && translations[key].trim()) {
              state.translationCache[key] = translations[key].trim();
              state.translationSources[key] = 'api';
              apiCount++;
            }
          }
          debugLog('🤖API', '#8B5CF6', '翻译完成: ' + apiCount + '/' + total + ' 个字段', apiCount === total ? '✅ 全覆盖' : '⚠️ 漏翻字段已记录');
          if (apiCount < total) {
            const missing = uniqueKeys.filter(k => !translations[k]);
            console.warn('⚠️ API 漏翻 ' + missing.length + ' 个:', missing.slice(0, 10));
          }
          updateButtonTranslations();
          renderTranslationTable(uniqueKeys);
          setApiStatus('翻译完成 ' + apiCount + '/' + total);
        } catch (parseErr) {
          clearInterval(progressTimer);
          setApiStatus('翻译失败');
          debugLog('🤖API', '#EF4444', '❌ JSON 解析失败', parseErr.message);
          showToast('API 翻译解析失败，使用本地翻译', 'warning');
        }
      } else {
        clearInterval(progressTimer);
        setApiStatus('翻译失败');
        debugLog('🤖API', '#EF4444', '❌ 回复中无JSON', '内容: ' + content.substring(0, 80));
      }
    } else {
      clearInterval(progressTimer);
      const errText = await resp.text().catch(() => '');
      setApiStatus('翻译失败');
      debugLog('🤖API', '#EF4444', '❌ HTTP ' + resp.status, errText.substring(0, 100));
      showToast('API 请求失败(' + resp.status + ')，使用本地翻译', 'warning');
    }
  } catch (e) {
    clearInterval(progressTimer);
    setApiStatus('翻译失败');
    debugLog('🤖API', '#EF4444', '❌ 网络/超时错误', e.message);
    showToast('API 连接失败，使用本地翻译', 'warning');
  }
}

function setApiStatus(msg) {
  btnTranslation.textContent = msg;
}

// 原地更新按钮中文文字
function updateButtonTranslations() {
  for (const entry of state.leafEntries) {
    if (state.translationCache[entry.keyName]) {
      entry.chineseName = state.translationCache[entry.keyName];
    }
  }
  const buttons = selectorButtons.querySelectorAll('.leaf-btn');
  buttons.forEach(btn => {
    const id = btn.getAttribute('data-id');
    const entry = state.leafEntries.find(e => e.id === id);
    if (entry) {
      const cn = btn.querySelector('.btn-cn');
      const newText = '（' + entry.chineseName + '）';
      if (cn && cn.textContent !== newText) {
        cn.textContent = newText;
        cn.style.transition = 'color 0.3s';
        cn.style.color = '#fbbf24';
        setTimeout(() => { cn.style.color = ''; }, 800);
      }
    }
  });
}

function autoTranslate(key) {
  const words = key.replace(/([a-z])([A-Z])/g, '$1_$2').toLowerCase().split('_');
  const translated = words.map(w => ROOT_WORDS[w] || '').filter(Boolean);
  // Count how many words got translated
  const totalWords = words.filter(w => w.length > 0).length;
  const translatedCount = translated.length;
  // If enough words translated, use the result
  if (translatedCount > 0 && translatedCount / totalWords >= 0.3) {
    return translated.join('') + (translatedCount < totalWords ? '等' : '');
  }
  // Fallback: use the key name itself (better than 《》 wrappers)
  // At least it's readable, and API will override it later
  return '字段:' + key;
}

function renderTranslationTable(uniqueKeys) {
  // Update button label with count
  btnTranslation.textContent = '翻译对照表 (' + uniqueKeys.length + ')';
  
  // Build modal content
  let rows = '';
  for (const key of uniqueKeys) {
    const source = state.translationSources[key] || 'local';
    const sourceLabel = source === 'dict' ? '词典' : source === 'api' ? 'API' : '本地';
    rows += `<tr>
      <td style="font-family:var(--font-mono);padding:7px 10px;line-height:1.6;">${escHtml(key)}</td>
      <td style="padding:7px 10px;line-height:1.6;">${escHtml(state.translationCache[key])}</td>
      <td style="padding:7px 10px;"><span class="trans-source ${source}">${sourceLabel}</span></td>
    </tr>`;
  }
  state._translationTableHTML = rows; // stored for modal
}

// Show translation table modal
btnTranslation.addEventListener('click', () => {

  const stats = `${Object.keys(state.translationSources).filter(k => state.translationSources[k] === 'dict').length}词典 / ${Object.keys(state.translationSources).filter(k => state.translationSources[k] === 'api').length}API / ${Object.keys(state.translationSources).filter(k => state.translationSources[k] === 'local').length}本地`;

    <div style="max-height:50vh;overflow-y:auto;border:1px solid var(--c-border);border-radius:var(--radius-sm);">
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead><tr><th style="text-align:left;padding:8px 10px;color:var(--c-text-muted);border-bottom:1px solid var(--c-border);position:sticky;top:0;background:var(--c-surface);">英文</th><th style="text-align:left;padding:8px 10px;color:var(--c-text-muted);border-bottom:1px solid var(--c-border);position:sticky;top:0;background:var(--c-surface);">中文</th><th style="text-align:left;padding:8px 10px;color:var(--c-text-muted);border-bottom:1px solid var(--c-border);position:sticky;top:0;background:var(--c-surface);">来源</th></tr></thead>

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ==================== SELECTOR BUTTONS - TREE ====================
function getVisibleEntries() {
  const q = searchBox.value.trim().toLowerCase();
  if (!q) return [...state.leafEntries];
  return state.leafEntries.filter(e =>
    e.keyName.toLowerCase().includes(q) ||
    e.chineseName.toLowerCase().includes(q) ||
    e.fullJsonPath.toLowerCase().includes(q) ||
    e.outputKey.toLowerCase().includes(q)
  );
}

// ==================== BUTTON TREE FROM STATE.TREENODES (exact match with left tree) ====================
let _entryByPath = null;
function buildEntryPathMap() {
  _entryByPath = new Map();
  for (const entry of state.leafEntries) {
    _entryByPath.set(entry.fullJsonPath, entry);
  }
}

function renderSelectorButtons() {
  selectorButtons.innerHTML = '';
  buildEntryPathMap();
  const frag = document.createDocumentFragment();
  if (state.treeNodes && state.treeNodes.children) {
    // Render root's children directly (skip $ wrapper)
    const sorted = [...state.treeNodes.children].sort((a, b) => a.key.localeCompare(b.key, 'zh-CN'));
    for (const child of sorted) {
      renderButtonsFromTreeNode(child, frag, 0);
    }
  }
  selectorButtons.appendChild(frag);
}

// Recursively traverse treeNodes → exact same structure & order as left tree
function renderButtonsFromTreeNode(node, container, depth) {
  const indentPx = depth * 16;

  if (node.isLeaf) {
    const entry = _entryByPath.get(node.path);
    if (entry) container.appendChild(createLeafButton(entry, depth));
    return;
  }

  // Handle non-leaf nodes (objects and arrays)
  if (!node.children || node.children.length === 0) return;
  const leafCount = countLeafDescendants(node);
  if (leafCount === 0) return;

  // Sort children: numeric keys by number, string keys by zh-CN
  const sorted = [...node.children].sort((a, b) => {
    const aNum = parseInt(a.key.replace(/[\[\]]/g, ''));
    const bNum = parseInt(b.key.replace(/[\[\]]/g, ''));
    if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
    return a.key.localeCompare(b.key, 'zh-CN');
  });

  // Group label: for arrays show "key [N]", for objects show "key"
  const label = node.type === 'array'
    ? `${escHtml(node.key)} [${node.children.length}]`
    : escHtml(node.key);

  const group = document.createElement('div');
  group.className = 'btn-group';
  group.setAttribute('data-group-path', node.path);

  const header = document.createElement('div');
  header.className = 'btn-group-header';
  header.style.paddingLeft = (indentPx + 8) + 'px';
  header.innerHTML = `
    <span class="grp-arrow expanded">▶</span>
    <span class="grp-path">${label}</span>
    <span class="grp-count">${leafCount} 项</span>
  `;
  header.addEventListener('click', () => {
    const body = group.querySelector('.btn-group-body');
    const arrow = header.querySelector('.grp-arrow');
    if (body) {
      const willExpand = body.classList.contains('collapsed');
      body.classList.toggle('collapsed');
      arrow.classList.toggle('expanded');
      syncTreeToggle(node.path, 'middle', willExpand);
    }
  });

  group.appendChild(header);

  const body = document.createElement('div');
  body.className = 'btn-group-body';

  // For object arrays: add prominent [*].field quick-select strip at the TOP of the body
  if (node.type === 'array' && node.children.length > 0) {
    const firstChild = node.children[0];
    if (firstChild.type === 'object' && firstChild.children) {
      const commonFields = firstChild.children.filter(c => c.isLeaf).map(c => c.key);
      if (commonFields.length > 0) {
        const wildStrip = document.createElement('div');
        wildStrip.className = 'grp-wild-strip';
        const wildLabel = document.createElement('span');
        wildLabel.className = 'wild-label';
        wildLabel.textContent = '⚡ 快速全选 [*].';
        wildStrip.appendChild(wildLabel);
        for (const f of commonFields) {
          const wb = document.createElement('span');
          wb.className = 'grp-wild-badge';
          wb.textContent = f;
          wb.title = '点击全选该数组所有元素的 "' + f + '" 字段（一键提取所有元素的此字段）';
          wb.addEventListener('click', (ev) => {
            ev.stopPropagation();
            wb.style.background = 'rgba(16,185,129,0.7)';
            wb.style.color = '#fff';
            wb.style.transform = 'scale(0.92)';
            setTimeout(() => { wb.style.background = ''; wb.style.color = ''; wb.style.transform = ''; }, 150);
            selectAllArrayField(node.path, f);
          });
          wildStrip.appendChild(wb);
        }
        body.appendChild(wildStrip);
      }
    }
  }

  for (const child of sorted) {
    renderButtonsFromTreeNode(child, body, depth + 1);
  }
  group.appendChild(body);
  container.appendChild(group);
}

function countLeafDescendants(node) {
  if (node.isLeaf) return 1;
  let count = 0;
  for (const child of node.children || []) {
    count += countLeafDescendants(child);
  }
  return count;
}

// Sync expand/collapse between left JSON tree and middle button tree
let _syncing = false;
function syncTreeToggle(path, source, expand) {
  if (_syncing) return;
  if (source === 'middle') debugLogMiddle(path, expand ? '展开' : '折叠');
  _syncing = true;
  try {
    if (source !== 'left') {
      const escPath = cssEscape(path);
      const leftRow = treeContainer.querySelector(`[data-path="${escPath}"]`);
      if (leftRow) {
        const arrow = leftRow.querySelector('.tree-arrow');
        const children = leftRow.closest('.tree-node')?.querySelector(':scope > .tree-children');
        if (arrow && children) {
          if (expand) { arrow.classList.add('expanded'); children.style.display = ''; }
          else { arrow.classList.remove('expanded'); children.style.display = 'none'; }
        }
      }
    }
    if (source !== 'middle') {
      const escPath = cssEscape(path);
      const midGroup = selectorButtons.querySelector(`[data-group-path="${escPath}"]`);
      if (midGroup) {
        const bd = midGroup.querySelector(':scope > .btn-group-body');
        const ar = midGroup.querySelector(':scope > .btn-group-header .grp-arrow');
        if (bd && ar) {
          if (expand) { bd.classList.remove('collapsed'); ar.classList.add('expanded'); }
          else { bd.classList.add('collapsed'); ar.classList.remove('expanded'); }
        }
      }
    }
  } finally { _syncing = false; }
}

function isValueEmpty(val) {
  return val === null || val === '' || val === undefined;
}

function createLeafButton(entry, depth) {
  const btn = document.createElement('button');
  btn.className = 'leaf-btn';
  btn.setAttribute('data-id', entry.id);
  btn.dataset.state = entry.state;
  updateBtnStyle(btn, entry);
  // Visual indent based on tree depth
  btn.style.paddingLeft = ((depth || 0) * 16 + 24) + 'px';

  // Red/green dot based on value
  const empty = isValueEmpty(entry.value);
  const dotClass = empty ? 'empty' : 'has';
  btn.innerHTML = `<span class="val-dot ${dotClass}"></span><span class="btn-en">${escHtml(entry.keyName)}</span><span class="btn-cn">（${escHtml(entry.chineseName)}）</span>`;

  if (entry.hasUnresolvedArray) {
    btn.classList.add('array-pending');
  }
  if (entry.hasUnresolvedArray && Object.values(entry.arrayIndexes).every(v => v < 0)) {
    if (checkAllArraysEmpty(entry)) btn.classList.add('array-empty');
  }

  if (Object.values(entry.arrayIndexes).some(v => v >= 0)) {
    const editIcon = document.createElement('span');
    editIcon.className = 'edit-idx';
    editIcon.textContent = '✎';
    editIcon.addEventListener('click', e => { e.stopPropagation(); showArrayModal(entry); });
    btn.appendChild(editIcon);
  }

  btn.addEventListener('click', () => handleBtnClick(entry));
  return btn;
}

function updateBtnStyle(btn, entry) {
  btn.classList.remove('state-previewed', 'state-selected');
  if (entry.state === 'previewed') btn.classList.add('state-previewed');
  if (entry.state === 'selected') btn.classList.add('state-selected');
  btn.dataset.state = entry.state;
}

function checkAllArraysEmpty(entry) {
  for (const [arrPath, idx] of Object.entries(entry.arrayIndexes)) {
    if (idx < 0) {
      // Check if this array is empty
      const arrNode = findNodeByPath([state.treeNodes], arrPath);
      if (arrNode && arrNode.type === 'array' && arrNode.children.length === 0) return true;
    }
  }
  return false;
}

function findNodeByPath(nodes, path) {
  for (const n of nodes) {
    if (n.path === path) return n;
    if (!n.isLeaf) {
      const found = findNodeByPath(n.children, path);
      if (found) return found;
    }
  }
  return null;
}

// ==================== BUTTON CLICK HANDLER ====================
// Select [*].fieldname → single wildcard entry (not all concrete [N] entries)
// Output: "fieldName": "$.arr[*].fieldName"
function selectAllArrayField(arrPath, fieldName) {
  const matching = state.leafEntries.filter(e => {
    return e.keyName === fieldName && e.fullJsonPath.startsWith(arrPath + '[');
  });
  if (matching.length === 0) { showToast('未找到匹配的 ' + fieldName + ' 字段', 'warning'); return; }

  // Check if already has a wildcard selection for this array+field
  const wildcardEntry = matching.find(e => e.state === 'selected' && e.wildcardPath);
  if (wildcardEntry) {
    // Toggle OFF
    wildcardEntry.state = 'default';
    wildcardEntry.wildcardPath = null;
    runDeDup();
    refreshAll();
    renderOutput();
    showToast('已取消 ' + arrPath + '[*].' + fieldName);
    debugLog('🔘全选', '#EF4444', '❌ 取消通配符 ' + arrPath + '[*].' + fieldName);
    return;
  }

  // Toggle ON: deselect conflicting entries from same array+field (both wildcard & concrete)
  const arrBase = arrPath;
  for (const e of state.leafEntries) {
    if ((e.state === 'selected' || e.state === 'previewed') && e.keyName === fieldName) {
      const base = getArrayBasePath(e.fullJsonPath);
      if (base === arrBase || e.fullJsonPath.startsWith(arrPath)) {
        e.state = 'default';
        e.wildcardPath = null;
      }
    }
  }
  // Select the first matching entry as the wildcard carrier
  const first = matching[0];
  first.state = 'selected';
  first.wildcardPath = arrPath + '[*].' + fieldName;

  runDeDup();
  refreshAll();
  renderOutput();
  showToast('已选通配符 ' + arrPath + '[*].' + fieldName);
  debugLog('🔘全选', '#10B981', `[*].${fieldName} → wildcardPath="${first.wildcardPath}"`, arrPath);
}

function handleBtnClick(entry) {
  const now = Date.now();
  if (now - state.lastClickTime < state.clickThrottle) return;
  state.lastClickTime = now;
  const nextState = entry.state === 'default' ? 'previewed' : entry.state === 'previewed' ? 'selected' : 'default';
  debugLogBtn(entry, '点击: ' + entry.state + ' → ' + nextState + ' | 值=' + (entry.value === null ? 'null' : entry.value === '' ? '""' : '✓'));

  // Array handling: only show modal if path has NO concrete index (e.g., [_] not [0])
  if (entry.hasUnresolvedArray && !/\[\d+\]/.test(entry.fullJsonPath)) {
    const allEmpty = checkAllArraysEmpty(entry);
    if (allEmpty) { showToast('数组为空，无元素可提取', 'warning'); return; }
    showArrayModal(entry);
    return;
  }

  // Three-state toggle
  if (entry.state === 'default') {
    // Cancel all other previews
    for (const e of state.leafEntries) {
      if (e !== entry && e.state === 'previewed') e.state = 'default';
    }
    entry.state = 'previewed';
    highlightInTree(entry);
    refreshAll();
  } else if (entry.state === 'previewed') {
    // Deselect other entries from the same array (only one per array)
    if (/^\[\d+\]$/.test(entry.keyName)) {
      const arrBase = getArrayBasePath(entry.fullJsonPath);
      for (const e of state.leafEntries) {
        if (e !== entry && e.state === 'selected' && getArrayBasePath(e.fullJsonPath) === arrBase) {
          e.state = 'default';
          e.wildcardPath = null; // clear wildcard when replacing with concrete [N]
        }
      }
    }
    entry.state = 'selected';
    runDeDup();
    refreshAll();
    renderOutput();
  } else if (entry.state === 'selected') {
    entry.state = 'default';
    runDeDup();
    refreshAll();
    renderOutput();
  }
}

function refreshAll() {
  const buttons = selectorButtons.querySelectorAll('.leaf-btn');
  buttons.forEach(btn => {
    const id = btn.getAttribute('data-id');
    const entry = state.leafEntries.find(e => e.id === id);
    if (entry) updateBtnStyle(btn, entry);
  });
  applySearchFilter();
}

function applySearchFilter() {
  const q = searchBox.value.trim().toLowerCase();
  const buttons = selectorButtons.querySelectorAll('.leaf-btn');
  const groups = selectorButtons.querySelectorAll('.btn-group');

  buttons.forEach(btn => {
    const id = btn.getAttribute('data-id');
    const entry = state.leafEntries.find(e => e.id === id);
    if (!entry) { btn.style.display = 'none'; return; }
    if (!q || entry.keyName.toLowerCase().includes(q) || entry.chineseName.toLowerCase().includes(q) || entry.fullJsonPath.toLowerCase().includes(q) || entry.outputKey.toLowerCase().includes(q)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });

  // Show/hide groups considering both search and filter
  groups.forEach(group => {
    const visibleBtns = group.querySelectorAll('.leaf-btn:not([style*="display: none"]):not(.filtered-empty)');
    group.style.display = visibleBtns.length > 0 ? '' : 'none';
  });
}

// Search with preview cancellation + auto-expand all groups
searchBox.addEventListener('input', () => {
  // Cancel preview on search
  let hadPreview = false;
  for (const e of state.leafEntries) {
    if (e.state === 'previewed') { e.state = 'default'; hadPreview = true; }
  }
  if (hadPreview) {
    clearAllHighlights();
    refreshAll();
  } else {
    applySearchFilter();
  }
  expandAllMiddleGroups();
});

// Expand all middle tree groups so search results are always visible
function expandAllMiddleGroups() {
  const bodies = selectorButtons.querySelectorAll('.btn-group-body.collapsed');
  bodies.forEach(b => b.classList.remove('collapsed'));
  const arrows = selectorButtons.querySelectorAll('.grp-arrow:not(.expanded)');
  arrows.forEach(a => a.classList.add('expanded'));
}

// ==================== HIGHLIGHT IN TREE ====================
function highlightInTree(entry) {
  clearAllHighlights();
  const targetPath = makeHighlightPath(entry);
  const row = treeContainer.querySelector(`[data-path="${cssEscape(targetPath)}"]`);
  if (!row) return;

  // Expand all parent nodes in LEFT tree
  let parent = row.closest('.tree-children');
  const parentPaths = [];
  while (parent) {
    parent.style.display = '';
    const siblingArrow = parent.previousElementSibling?.querySelector('.tree-arrow');
    if (siblingArrow) siblingArrow.classList.add('expanded');
    // Collect parent path for middle tree sync
    const parentRow = parent.previousElementSibling;
    if (parentRow) {
      const pp = parentRow.getAttribute('data-path');
      if (pp) parentPaths.push(pp);
    }
    parent = parent.parentElement?.closest('.tree-children');
  }

  // Also expand parent groups in MIDDLE tree
  for (const pp of parentPaths) {
    expandMiddleGroup(pp);
  }

  // Triple rAF: wait for parent expansion DOM reflow, then scroll smoothly into view
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        row.classList.add('highlight');
        setTimeout(() => row.classList.remove('highlight'), 2200);
      });
    });
  });
}

function expandMiddleGroup(path) {
  const escPath = cssEscape(path);
  const midGroup = selectorButtons.querySelector(`[data-group-path="${escPath}"]`);
  if (midGroup) {
    const body = midGroup.querySelector(':scope > .btn-group-body');
    const arrow = midGroup.querySelector(':scope > .btn-group-header .grp-arrow');
    if (body && body.classList.contains('collapsed')) {
      body.classList.remove('collapsed');
      if (arrow) arrow.classList.add('expanded');
    }
  }
}

function makeHighlightPath(entry) {
  return buildFullPath(entry);
}

function clearAllHighlights() {
  treeContainer.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
}

function cssEscape(s) {
  return s.replace(/[!"#$%&'()*+,./:;<=>?@[\]^`{|}~]/g, '\\$&');
}

// ==================== ARRAY MODAL ====================
function showArrayModal(entry) {
  // Sequential array selection
  const unresolved = Object.entries(entry.arrayIndexes).filter(([_, v]) => v < 0);
  if (unresolved.length === 0) {
    // All resolved already, just go to preview
    entry.hasUnresolvedArray = false;
    entry.state = 'previewed';
    for (const e of state.leafEntries) {
      if (e !== entry && e.state === 'previewed') e.state = 'default';
    }
    highlightInTree(entry);
    refreshAll();
    return;
  }

  const [arrPath, _] = unresolved[0];
  const arrNode = findNodeByPath([state.treeNodes], arrPath);

  if (!arrNode || arrNode.children.length === 0) {
    showToast('数组为空，无元素可提取', 'warning');
    return;
  }

  const remaining = unresolved.length;
  let html = `<h3>选择数组下标</h3>`;
  if (remaining > 1) {
    html += `<div class="array-step">步骤 1/${remaining}：请选择 <code>${arrPath}</code> 的下标</div>`;
  } else {
    html += `<div class="array-step">请选择 <code>${arrPath}</code> 的下标</div>`;
  }

  const firstChild = arrNode.children[0];
  if (firstChild.isLeaf) {
    // Basic type array
    html += '<div class="modal-array-list">';
    for (let i=0; i<arrNode.children.length; i++) {
      const child = arrNode.children[i];
      let val = child.type === 'string' ? '"' + String(child.value) + '"' : String(child.value);
      if (val.length > 60) val = val.substring(0, 60) + '...';
      html += `<div class="modal-array-item basic-item" data-idx="${i}">[${i}] ${escHtml(val)}</div>`;
    }
    html += '</div>';
  } else if (arrNode.children[0].type === 'object') {
    // Object array - table
    const keys = Object.keys(arrNode.children[0].value || {});
    const maxShow = 10;
    html += '<table class="modal-array-table"><thead><tr><th>#</th>';
    for (const k of keys.slice(0, 4)) html += `<th>${escHtml(k)}</th>`;
    html += '<th>...</th></tr></thead><tbody>';
    for (let i=0; i<Math.min(arrNode.children.length, maxShow); i++) {
      const child = arrNode.children[i];
      html += `<tr data-idx="${i}" style="cursor:pointer"><td>[${i}]</td>`;
      for (const k of keys.slice(0, 4)) {
        const v = child.children?.find(c => c.key === k);
        let val = v ? String(v.value) : '-';
        if (val.length > 20) val = val.substring(0, 20) + '...';
        html += `<td>${escHtml(val)}</td>`;
      }
      html += '<td>...</td></tr>';
    }
    if (arrNode.children.length > maxShow) {
      html += `<tr><td colspan="${Math.min(keys.length, 4) + 2}" class="modal-more">还有 ${arrNode.children.length - maxShow} 项</td></tr>`;
    }
    html += '</tbody></table>';
  } else if (arrNode.children[0].type === 'array') {
    // Nested array
    html += '<div class="modal-array-list">';
    for (let i=0; i<arrNode.children.length; i++) {
      html += `<div class="modal-array-item" data-idx="${i}">[${i}] 数组 (${arrNode.children[i].children.length} 项)</div>`;
    }
    html += '</div>';
  }

  html += `<div class="modal-actions">
    <button class="modal-btn" onclick="closeModal()">取消</button>
  </div>`;

  showModal(html);

  // Add click handlers
  setTimeout(() => {
    modalBox.querySelectorAll('[data-idx]').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx);
        entry.arrayIndexes[arrPath] = idx;
        const stillUnresolved = Object.entries(entry.arrayIndexes).filter(([_, v]) => v < 0);
        if (stillUnresolved.length > 0) {
          // Continue with next array
          showArrayModal(entry);
        } else {
          entry.hasUnresolvedArray = false;
          entry.state = 'previewed';
          for (const e of state.leafEntries) {
            if (e !== entry && e.state === 'previewed') e.state = 'default';
          }
          closeModal();
          // Build full path with indices
          entry.fullJsonPath = buildFullPath(entry);
          highlightInTree(entry);
          refreshAll();
        }
      });
    });
  }, 50);
}

function buildFullPath(entry) {
  let path = entry.fullJsonPath;
  for (const [arrPath, idx] of Object.entries(entry.arrayIndexes)) {
    if (idx >= 0) {
      // Replace arrPath[N] with arrPath[idx], not just appending
      const escaped = arrPath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      path = path.replace(new RegExp(escaped + '\\[\\d+\\]'), arrPath + '[' + idx + ']');
    }
  }
  return path;
}
// ==================== DEDUP ====================
function runDeDup() {
  const selected = state.leafEntries.filter(e => e.state === 'selected');
  if (selected.length < 2) return;

  // Group conflicting entries by outputKey
  const groups = new Map();
  for (const e of selected) {
    if (!groups.has(e.outputKey)) groups.set(e.outputKey, []);
    groups.get(e.outputKey).push(e);
  }

  // For each group with conflicts, check if they're from the same array
  for (const [okey, entries] of groups) {
    if (entries.length < 2) continue;
    // If all entries are from the same array (different [N]), use index suffix
    const bases = entries.map(e => e.fullJsonPath.replace(/\[\d+\]/g, '[_]'));
    const allSameArray = bases.every(b => b === bases[0]);
    if (allSameArray && !entries[0].userEdited) {
      for (const e of entries) {
        const idxMatch = e.fullJsonPath.match(/\[(\d+)\]/g);
        const lastIdx = idxMatch ? idxMatch[idxMatch.length - 1].replace(/[\[\]]/g, '') : '';
        e.outputKey = e.outputKey + '_' + lastIdx;
      }
      continue;
    }
    // Different arrays: abbreviate all
    for (const e of entries) {
      if (!e.userEdited) e.outputKey = abbreviateKey(e);
    }
  }

  // Final pass: resolve any remaining duplicates
  const used = new Set();
  for (const entry of selected) {
    let key = entry.outputKey;
    if (used.has(key) && !entry.userEdited) {
      const parts = entry.fullJsonPath.split('.');
      key = abbreviatePart(parts[parts.length - 2].replace(/\[\d+\]/g, '')) + '_' + key;
      let level = 3;
      while (used.has(key) && level <= parts.length) {
        key = abbreviatePart(parts[parts.length - level].replace(/\[\d+\]/g, '')) + '_' + key;
        level++;
      }
      entry.outputKey = key;
    }
    used.add(entry.outputKey);
  }
}

// Strategy B: keep numbers + first 3 alpha, limit total parent length
function abbreviatePart(word) {
  if (!word) return '';
  // Pure digits or digit-starting: keep the number part only
  if (/^\d/.test(word)) return (word.match(/\d+/) || [''])[0];
  // Alpha + numbers (e.g., h264): keep alpha prefix + number
  const match = word.match(/^([a-z]+)(\d.*)$/i);
  if (match) return (match[1].substring(0, 2) || match[1][0]) + match[2].substring(0, 3);
  // Pure alpha: first 3 chars
  return word.substring(0, 3);
}

// Abbreviate parent object + array name
function abbreviateKey(entry) {
  const parts = entry.fullJsonPath.split('.');
  const rawParent = parts[parts.length - 2] || '';
  const parentName = rawParent.replace(/\[\d+\]/g, '');
  const parentParts = parentName.split('_');
  let shortParent = parentParts.map(p => abbreviatePart(p)).join('');
  if (shortParent.length > 8) shortParent = shortParent.substring(0, 8);
  const arrFirst = entry.outputKey.split('_')[0];
  return shortParent + '_' + arrFirst;
}

function getArrayBasePath(path) {
  // Only strip the LAST array index, not all
  return path.replace(/\[\d+\]$/, '');
}

// ==================== BATCH OPERATIONS ====================
btnSelectAll.addEventListener('click', () => {
  if (!confirm('将跳过预览直接加入输出，确定？')) return;
  const visible = getVisibleEntries();
  for (const e of visible) {
    if (e.hasUnresolvedArray) continue; // Skip unresolved arrays
    if (e.state === 'default') e.state = 'selected';
  }
  runDeDup();
  refreshAll();
  renderOutput();
});

btnInvert.addEventListener('click', () => {
  if (!confirm('将跳过预览直接加入输出，确定？')) return;
  const visible = getVisibleEntries();
  for (const e of visible) {
    if (e.hasUnresolvedArray) continue;
    e.state = e.state === 'selected' ? 'default' : 'selected';
  }
  runDeDup();
  refreshAll();
  renderOutput();
});

btnClear.addEventListener('click', () => {
  for (const e of state.leafEntries) {
    if (e.state === 'selected') e.state = 'default';
  }
  refreshAll();
  renderOutput();
});

// Filter empty data toggle
btnFilterEmpty.addEventListener('click', () => {
  filterEmptyActive = !filterEmptyActive;
  btnFilterEmpty.classList.toggle('active', filterEmptyActive);
  btnFilterEmpty.textContent = filterEmptyActive ? '过滤中…' : '过滤空数据';
  applyEmptyFilter();
});

function applyEmptyFilter() {
  const buttons = selectorButtons.querySelectorAll('.leaf-btn');
  buttons.forEach(btn => {
    const id = btn.getAttribute('data-id');
    const entry = state.leafEntries.find(e => e.id === id);
    if (entry) {
      if (filterEmptyActive && isValueEmpty(entry.value)) {
        btn.classList.add('filtered-empty');
      } else {
        btn.classList.remove('filtered-empty');
      }
    }
  });
  // Re-evaluate group visibility
  const groups = selectorButtons.querySelectorAll('.btn-group');
  groups.forEach(group => {
    const visibleBtns = group.querySelectorAll('.leaf-btn:not(.filtered-empty):not([style*="display: none"])');
    group.style.display = visibleBtns.length > 0 ? '' : 'none';
  });
}

// ==================== OUTPUT PANEL ====================
// Store plain text separately for copy
let _outputPlainText = '{ "fields": {} }';

function setOutputCode(jsonObj) {
  const json = JSON.stringify(jsonObj, null, 2);
  _outputPlainText = json;
  outputCodeEl.textContent = json;
  outputStats.style.display = jsonObj.fields && Object.keys(jsonObj.fields).length ? 'block' : 'none';
  if (jsonObj.fields) outputStats.textContent = '已选 ' + Object.keys(jsonObj.fields).length + ' 个字段';
}
function updateOutputCodeOnly() {
  const selected = state.leafEntries.filter(e => e.state === 'selected');
  if (selected.length === 0) {
    setOutputCode({ fields: {} });
  } else {
    const fields = {};
    for (const entry of selected) {
      fields[entry.outputKey] = entry.wildcardPath || buildFullPath(entry);
    }
    setOutputCode({ fields });
  }
}

function renderOutput() {
  const selected = state.leafEntries.filter(e => e.state === 'selected');
  outputFieldsList.innerHTML = '';
  const fields = {};

  for (const entry of selected) {
    const fullPath = entry.wildcardPath || buildFullPath(entry);
    fields[entry.outputKey] = fullPath;

    const row = document.createElement('div');
    row.className = 'output-field-row';
    if (entry.wildcardPath) row.classList.add('wildcard-row');

    const keyInput = document.createElement('input');
    keyInput.className = 'output-key-input';
    keyInput.value = entry.outputKey;
    keyInput.addEventListener('input', () => {
      entry.outputKey = keyInput.value || entry.keyName;
      entry.userEdited = true;
    });
    keyInput.addEventListener('blur', () => {
      runDeDup();
      updateOutputCodeOnly();
    });

    const pathDisplay = document.createElement('span');
    pathDisplay.className = 'output-path-display';
    if (entry.wildcardPath) {
      pathDisplay.style.cssText = 'color:#6ee7b7;font-weight:600;';
      pathDisplay.setAttribute('data-wildcard', 'true');
    }
    pathDisplay.textContent = fullPath;

    const removeBtn = document.createElement('span');
    removeBtn.className = 'output-remove';
    removeBtn.textContent = '×';
    removeBtn.title = '移除';
    removeBtn.addEventListener('click', () => {
      entry.state = 'default';
      runDeDup();
      refreshAll();
      row.remove();
      updateOutputCodeOnly();
      if (state.leafEntries.filter(e => e.state === 'selected').length === 0) {
        outputFieldsList.innerHTML = '<div class="empty-state-msg">← 请在中间选择要抽取的字段</div>';
        setOutputCode({ fields: {} });
      }
    });

    row.appendChild(keyInput);
    row.appendChild(pathDisplay);
    row.appendChild(removeBtn);
    outputFieldsList.appendChild(row);
  }

  if (selected.length === 0) {
    outputFieldsList.innerHTML = '<div class="empty-state-msg">← 请在中间选择要抽取的字段</div>';
    setOutputCode({ fields: {} });
  } else {
    setOutputCode({ fields });
  }
}

// Copy button
btnCopy.addEventListener('click', async () => {
  const text = _outputPlainText;
  try {
    await navigator.clipboard.writeText(text);
    btnCopy.classList.add('copied');
    btnCopy.textContent = '已复制';
    setTimeout(() => {
      btnCopy.classList.remove('copied');
      btnCopy.textContent = '一键复制';
    }, 2000);
  } catch {
    showToast('复制失败，请手动选择', 'error');
  }
});

// ==================== KEYBOARD SHORTCUT ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ==================== RESIZE PANELS ====================
(function initResizers() {
  const panels = document.querySelectorAll('#main > .panel');
  const resizers = document.querySelectorAll('#main > .resizer');
  if (panels.length !== 3 || resizers.length !== 2) return;
  let dragState = null;

  resizers.forEach((resizer, i) => {
    resizer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const leftPanel = panels[i];
      const rightPanel = panels[i + 1];
      dragState = { leftPanel, rightPanel, startX: e.clientX, leftW: leftPanel.offsetWidth, rightW: rightPanel.offsetWidth };
      resizer.classList.add('resizing');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragState) return;
    const dx = e.clientX - dragState.startX;
    const minW = 180;
    const newLeft = Math.max(minW, dragState.leftW + dx);
    const newRight = Math.max(minW, dragState.rightW - dx);
    const total = newLeft + newRight;
    if (total > 0) {
      dragState.leftPanel.style.flex = 'none';
      dragState.leftPanel.style.width = newLeft + 'px';
      dragState.rightPanel.style.flex = 'none';
      dragState.rightPanel.style.width = newRight + 'px';
    }
  });

  document.addEventListener('mouseup', () => {
    if (!dragState) return;
    dragState = null;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    [].forEach.call(resizers, r => r.classList.remove('resizing'));
  });
})();
